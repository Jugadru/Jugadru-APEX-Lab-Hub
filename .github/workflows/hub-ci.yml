name: Hub contracts and cross-repository smoke
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hub
          persist-credentials: false
      - name: Test contracts and controlled subprocesses
        working-directory: hub
        run: python3 -m unittest discover -s tests -v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Simulation
          ref: 5374d96f45731c0a50a03006e95a7296c10673ec
          path: game
          persist-credentials: false
      - name: Run accessible cross-project DAG (Hub and public game)
        working-directory: hub
        run: |
          python3 -m hub.orchestrator run contracts/session.ci.json \
            --trusted-checkouts \
            --checkout hub "$GITHUB_WORKSPACE/hub" "$(git rev-parse HEAD)" \
            --checkout game "$GITHUB_WORKSPACE/game" 5374d96f45731c0a50a03006e95a7296c10673ec \
            --registry "$RUNNER_TEMP/hub-registry" \
            --output "$RUNNER_TEMP/hub-smoke"
      - name: Verify persisted session from a separate process
        working-directory: hub
        run: |
          python3 -m hub.registry --registry "$RUNNER_TEMP/hub-registry" list > "$RUNNER_TEMP/hub-smoke/registry-list.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hub-smoke"
          report = json.loads((root / "report.json").read_text())
          cmd = [sys.executable, "-m", "hub.registry", "--registry", str(root.parent / "hub-registry")]
          row = json.loads(subprocess.check_output(cmd + ["show", report["session_id"]]))
          history = json.loads(subprocess.check_output(cmd + ["history", report["session_id"]]))
          assert row["phase"] == "FINISHED" and row["outcome"] == "PASS" and row["report"] == report
          assert history[0]["kind"] == "START" and history[-1]["kind"] == "FINISH"
          assert set(report["targets"]) == {"hub", "game"}
          assert len(report["tasks"]) == 3 and all(t["status"] == "PASS" for t in report["tasks"])
          print("HYPER_PRIVATE_NOT_RUN: hosted token has no cross-private-repository access")
          (root / "registry-history.json").write_text(json.dumps(history, indent=2))
          print("APEX_REGISTRY_PERSISTENCE_PASS", report["session_id"], len(history))
          PY
      - name: Verify real GitHub CI receipt (previous integrated revision)
        working-directory: hub
        env:
          APEX_CI_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          from hub.ci_receipt import receipt
          result = receipt(46017566189, "7b5a560093d8f445f084405c0fa21ad09d006bda", "main")
          assert result["outcome"] == "PASS", result["diagnostic"]
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "hub-smoke/ci-receipt.json").write_text(json.dumps(result, indent=2))
          print("APEX_REAL_CI_RECEIPT_PASS", result["run_id"], result["sha"])
          PY
      - name: Run real bounded experiment queue
        working-directory: hub
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          from hub.scheduler import Scheduler
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          s = Scheduler(root / "experiment-registry")
          spec = json.loads(pathlib.Path("contracts/experiment.example.json").read_text())
          a = s.enqueue(spec, sha)
          b = s.enqueue({**spec, "priority": 100}, sha)
          x, y = s.run_next(os.getcwd(), sha), s.run_next(os.getcwd(), sha)
          assert x["id"] == b["id"] and y["id"] == a["id"]
          assert x["state"] == y["state"] == "PASS"
          assert x["telemetry"]["result"] == y["telemetry"]["result"]
          assert Scheduler(root / "experiment-registry").get(a["id"]) == y
          (root / "hub-smoke/experiment-results.json").write_text(json.dumps([x,y], indent=2))
          print("APEX_EXPERIMENT_QUEUE_PASS", sha, x["telemetry"]["result"]["result_sha256"])
          PY
      - name: Run real department gateway and GitHub receipt
        working-directory: hub
        env:
          APEX_CI_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          from hub.gateway import Gateway
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          w=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          game="5374d96f45731c0a50a03006e95a7296c10673ec"
          g=Gateway(root/"gateway-state")
          manifest=json.loads(pathlib.Path("contracts/session.ci.json").read_text())
          tasks=[{**t,"department":d} for t,d in zip(manifest["tasks"][:2],["software","performance"])]
          p=g.propose({"schema":1,"objective":"Exact department smoke","targets":{"hub":sha,"game":game},"tasks":tasks})
          g.message(p["id"],"software","performance","Revision before inventory")
          g.approve(p["id"],p["plan_sha256"],"Reviewed hosted fixture only")
          result=g.run(p["id"],p["plan_sha256"],[("hub",w/"hub",sha),("game",w/"game",game)])
          assert result["state"]=="PASS" and len(result["handoffs"])==2
          c=g.propose_ci(46045078465,"0b145f971b29fd78f0748e1a1fe5fc4a14a7a346","main")
          g.approve(c["id"],c["plan_sha256"],"Read only hosted CI proof")
          receipt=g.run(c["id"],c["plan_sha256"],[])
          assert receipt["state"]=="PASS"
          assert Gateway(root/"gateway-state").get(p["id"])==result
          (root/"hub-smoke/gateway.json").write_text(json.dumps({"dag":result,"ci":receipt,"history":g.history(p["id"])},indent=2))
          print("REAL_AGENT_GATEWAY_PASS",sha,p["id"],c["id"])
          PY
      - name: Run actual infrastructure health snapshot
        working-directory: hub
        env:
          APEX_HEALTH_HUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          from hub.health import Health
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          w=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          game="5374d96f45731c0a50a03006e95a7296c10673ec"
          h=Health(root/"health-state")
          p=h.scan([("hub",w/"hub",sha),("game",w/"game",game)],["hub"],
                   evidence=[(root/"hub-smoke",root/"hub-smoke/report.json")])
          assert p["local_repositories"]["hub"]["status"]=="PASS"
          assert p["local_repositories"]["game"]["status"]=="PASS"
          assert p["remote_repositories"]["hub"]["metadata"]["status"]=="PASS",p["remote_repositories"]["hub"]["metadata"]
          # Main can be running this very job, failed previously, or have advanced.
          # Verify live observation, not a self-referential release approval.
          live=p["remote_repositories"]["hub"]["ci"]
          assert live["status"] in ("PASS","FAIL","INCONCLUSIVE"),live
          from hub.ci_receipt import receipt
          prior=receipt(46054921416,"89b3104b6205f73f6eb5149519d43f7a6f200b3e","main",token=os.environ["APEX_HEALTH_HUB_TOKEN"])
          assert prior["outcome"]=="PASS"
          (root/"hub-smoke/health-prior-ci.json").write_text(json.dumps(prior,indent=2))
          print("HEALTH_LIVE_CI_OBSERVATION",live["status"])
          assert p["evidence"][0]["status"]=="PASS"
          assert p["runtimes"]["python"]["status"]=="PASS" and p["runtimes"]["git"]["status"]=="PASS"
          assert p["resources"]["cpu"]["status"]=="PASS" and p["resources"]["memory"]["status"]=="PASS"
          assert p["remote_repositories"]["hyper"]["metadata"]["status"]=="NOT_RUN"
          assert Health(root/"health-state").get(p["id"])==p
          (root/"hub-smoke/health.json").write_text(json.dumps(p,indent=2))
          print("REAL_INFRASTRUCTURE_HEALTH_PASS",sha,p["id"],p["summary"]["status"])
          PY
      - name: Build actual private offline dashboard
        working-directory: hub
        run: |
          python3 -m hub.dashboard --registry orchestration "$RUNNER_TEMP/hub-registry" \
            --registry experiments "$RUNNER_TEMP/experiment-registry" \
            --registry departments "$RUNNER_TEMP/gateway-state" \
            --registry infrastructure "$RUNNER_TEMP/health-state" \
            --output "$RUNNER_TEMP/hub-smoke/dashboard"
          python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"hub-smoke/dashboard"
          p=json.loads((root/"dashboard.json").read_text())
          s={r["label"]:r["sections"] for r in p["registries"]}
          assert not p["live"] and s["orchestration"]["sessions"]["counts"]=={"FINISHED":1}
          assert s["experiments"]["experiments"]["counts"]=={"PASS":2}
          assert s["departments"]["gateway_cases"]["counts"]=={"PASS":2}
          assert s["infrastructure"]["health_snapshots"]["total"]==1
          assert s["infrastructure"]["graphics_runs"]["status"]=="NOT_RUN"
          assert "APEX COMMAND CENTER" in (root/"index.html").read_text()
          print("REAL_DASHBOARD_PASS",len(p["registries"]))
          PY
      - name: Run real bounded engineering mission
        working-directory: hub
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          from hub.mission import Mission
          from hub.dashboard import export
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          w=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          game="5374d96f45731c0a50a03006e95a7296c10673ec"
          manifest=json.loads(pathlib.Path("contracts/session.ci.json").read_text())
          tasks=[{**t,"department":d} for t,d in zip(manifest["tasks"][:2],["software","performance"])]
          request={"schema":1,"objective":"Bounded hosted mission","targets":{"hub":sha,"game":game},"tasks":tasks,
                   "calibration":json.loads(pathlib.Path("contracts/experiment.example.json").read_text()),
                   "research":[],"graphics":False,"development":["docs/mission-example.md"]}
          m=Mission(root/"mission-state")
          p=m.propose(request)
          m.approve(p["id"],p["plan_sha256"],"Reviewed hosted diagnostic fixture only")
          result=m.run(p["id"],p["plan_sha256"],[("hub",w/"hub",sha),("game",w/"game",game)])
          assert result["state"]=="PASS",result
          assert len(result["stages"])==6 and all(s["status"]=="PASS" for s in result["stages"])
          assert Mission(root/"mission-state").get(p["id"])==result
          output=root/"hub-smoke/mission"
          output.mkdir()
          (output/"report.json").write_text(json.dumps(result,indent=2))
          (output/"history.json").write_text(json.dumps(m.history(p["id"]),indent=2))
          import shutil
          shutil.copytree(root/"mission-state"/("mission-"+p["id"])/"dashboard",output/"domain-dashboard")
          export([("missions",root/"mission-state")],output/"controller-dashboard")
          print("REAL_ENGINEERING_MISSION_PASS",sha,p["id"],len(result["stages"]))
          PY
      - name: Audit completed mission evidence
        working-directory: hub
        env:
          APEX_CI_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          from hub.mission import Mission
          from hub.ci_receipt import receipt
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          output=root/"hub-smoke/mission"
          row=json.loads((output/"report.json").read_text())
          m=Mission(root/"mission-state")
          audit=m.audit(row["id"])
          assert audit["status"]=="PASS",audit
          (output/"audit.json").write_text(json.dumps(audit,indent=2))
          prior=receipt(46062456190,"ee04b3c9bb593d9bb36652019be9f5c510a37c47","main")
          assert prior["outcome"]=="PASS"
          (output/"prior-2.0-ci.json").write_text(json.dumps(prior,indent=2))
          # Exercise actual tampering detection on a disposable dashboard file, then restore bytes.
          p=root/"mission-state"/("mission-"+row["id"])/"dashboard/index.html"
          original=p.read_bytes()
          try:
              p.write_bytes(original+b"tamper")
              assert m.audit(row["id"])["status"]=="FAIL"
              assert m.get(row["id"])==row
          finally:
              p.write_bytes(original)
          assert m.audit(row["id"])["status"]=="PASS"
          print("REAL_MISSION_AUDIT_PASS",row["id"],len(audit["checks"]))
          PY
      - name: Run real department intelligence handoff
        working-directory: hub
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          from hub.departments import Departments
          from hub.gateway import Gateway
          from hub.dashboard import export
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          w=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          game="5374d96f45731c0a50a03006e95a7296c10673ec"
          manifest=json.loads(pathlib.Path("contracts/session.ci.json").read_text())
          req={"schema":1,"objective":"Reviewed department handoff","targets":{"hub":sha,"game":game},
               "tasks":[{**t,"topic":"auto"} for t in manifest["tasks"][:2]]}
          d=Departments(root/"department-state")
          p=d.propose(req)
          assert p["plan"]["assignments"]["inventory"]["owner"]=="performance"
          d.review(p["id"],p["plan_sha256"],"quality","accept","Hosted fixture review")
          row=d.delegate(p["id"],p["plan_sha256"])
          g=Gateway(d.store.root)
          q=g.get(row["gateway_id"])
          assert q["state"]=="PROPOSED"
          g.approve(q["id"],q["plan_sha256"],"Hosted fixture execution")
          case=g.run(q["id"],q["plan_sha256"],[("hub",w/"hub",sha),("game",w/"game",game)])
          assert case["state"]=="PASS",case
          result=d.observe(p["id"])
          assert result["observation"]["artifact_integrity"]=="PASS"
          metrics=d.metrics()
          assert metrics["observed_cases"]==1 and metrics["task_counts"]["software"]=={"PASS":1}
          out=root/"hub-smoke/departments"
          out.mkdir()
          (out/"report.json").write_text(json.dumps(result,indent=2))
          (out/"metrics.json").write_text(json.dumps(metrics,indent=2))
          report=export([("departments",d.store.root)],out/"dashboard")
          assert report["registries"][0]["sections"]["department_plans"]["counts"]=={"OBSERVED":1}
          print("REAL_DEPARTMENT_INTELLIGENCE_PASS",sha,p["id"],q["id"])
          PY
      - name: Run real engineering knowledge memory
        working-directory: hub
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          from hub.knowledge import Knowledge
          from hub.dashboard import export
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          out=root/"hub-smoke/knowledge";out.mkdir()
          d=json.loads((root/"hub-smoke/departments/report.json").read_text())
          m=json.loads((root/"hub-smoke/mission/report.json").read_text())
          k=Knowledge(root/"knowledge-state")
          a=k.ingest("department",root/"department-state",d["id"])
          b=k.ingest("mission",root/"mission-state",m["id"])
          assert k.ingest("department",root/"department-state",d["id"])==a
          assert k.audit(a["id"],root/"department-state")["status"]=="PASS"
          assert k.audit(b["id"],root/"mission-state")["status"]=="PASS"
          note=k.annotate({"schema":1,"kind":"decision","department":"software","title":"Exact revisions",
                           "body":"Hosted test declaration, no new permissions","tags":["architecture"],
                           "evidence_ids":[a["id"],b["id"]],"supersedes":None,"provenance":None})
          assert note["state"]=="DECLARED" and len(k.search("Exact revisions","software"))>=1
          (out/"report.json").write_text(json.dumps({"evidence":[a,b],"annotation":note},indent=2))
          report=export([("knowledge",k.store.root)],out/"dashboard")
          assert report["registries"][0]["sections"]["knowledge_entries"]["counts"]=={"VERIFIED":2,"DECLARED":1}
          print("REAL_ENGINEERING_KNOWLEDGE_PASS",sha,a["id"],b["id"],note["id"])
          PY
      - name: Run real approved MCP stdio exchange
        working-directory: hub
        run: python3 -B -m tests_mcp_smoke
      - name: Run real local code candidate construction
        working-directory: hub
        run: python3 -B -m tests_code_smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/apex-asset-factory
          ref: bfcbe2f6231007ec29a4ace89dd0d98fffb43b9a
          path: factory
          persist-credentials: false
      - name: Run real advanced geometry adapter
        working-directory: hub
        run: python3 -B -m tests_graphics_smoke
      - name: Prepare reviewed Godot runtime
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Run real isolated Godot benchmark
        working-directory: hub
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -B -m tests_benchmark_smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Foundation
          ref: 1c226891f24796d0a14535693d32f626a5b476f5
          path: foundation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Engineering-Lab
          ref: e25d12749e79279c6fa6e8abf387d938566ebb24
          path: engineering
          persist-credentials: false
      - name: Run real Engineering Racecraft integration
        working-directory: hub
        run: python3 -B -m tests_racecraft_smoke
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hub-smoke
          path: ${{ runner.temp }}/hub-smoke
          retention-days: 7
          if-no-files-found: warn
